# dsh-tg-session bundle patch — mounts one Host service row into the profile.
#
# 契約來源（版本 0.1.5-rc.1，皆為實讀官方原始碼，非憑記憶）：
#   - patch 格式：top-level YAML 陣列；`insert:` 清單可掛新列（範例：dsh-headless/cordis.patch.yml）
#   - 「patch 會整段取代該列的 config」→ 本檔只 insert，不覆寫任何既有列
#   - 這一列注入的服務全部由 dsh-base / dsh-web-app 提供：
#       agents / agentDefaultModel / agentPresets / permissionPresets /
#       sessionTitle / workspaceRegistry / sessions
#   - 建立 Workspace-backed Session 的序列取自 dsh-webhook/lib/index.js；
#     取答案的序列（whenIdle + session.eventAt 掃描）取自 dsh-headless/lib/index.js
#
# 金鑰不寫在這裡：插件預設讀 ~/.dsh/notify-secrets.json（在 profile 之外 → 不進備份/雲端）。

- insert:
    # ── ① 核准回答者（**零注入**，必須第一個）──────────────────────────────
    # 為什麼零注入、為什麼排第一（2026-09-14 實測真因）：
    #   approval/request 的 waterfall 依註冊順序、遇到第一個有回傳值就停；本機實際順序是
    #     ① dsh-acp  ② dsh-api-remotes（轉給瀏覽器並「等人按」）  ③ 本插件
    #   只要有人在看 GUI，②就會一直等 → ③永遠輪不到。
    #   而任何有 inject 的插件都要等 web-app 的服務（workspaceRegistry／agentPresets）才啟動，
    #   那時 ② 早已註冊 → 所以「靠服務的插件永遠贏不了」。這一列刻意零注入、並在 profile 的
    #   dsh.profile.bundles 排到 dsh-web-app 之前，才能在 ② 之前註冊。
    - id: tg-approval-answerer
      name: 'dsh-tg-session/answerer'
      config:
        approveFromTelegram: true
        approvalTimeoutMinutes: 10
        chatId: ''
        workspacePath: 'C:\Users\User\.dsh\profiles\web'

    # ── ② 主插件（Telegram ↔ DSH 的派工與回報）────────────────────────────
    - id: tg-session
      name: 'dsh-tg-session'
      inject: [agents, agentDefaultModel, agentPresets, permissionPresets, sessionTitle, workspaceRegistry, sessions]
      config:
        # 只認這個 chat（留空＝讀 notify-secrets.json 的 chatId）
        chatId: ''
        dailyCapCny: 10
        timeoutMinutes: 15
        agentPreset: standard
        permissionPreset: workspace-write
        # 工作目錄＝被監看的工作區（session 會出現在這個 Workspace 的 GUI 清單）
        workspacePath: 'C:\Users\User\.dsh\profiles\web'
        pollSeconds: 3
        approveFromTelegram: true
        approvalTimeoutMinutes: 10
